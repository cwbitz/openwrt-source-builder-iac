---
project_root: "{{ playbook_dir | dirname }}"

# Repository:tag of the build environment built from files/Dockerfile. The tag is
# stable, not versioned: the role re-tags it whenever that file changes and
# records the file's digest (`build_image_digest`) in build-info/source.json, so
# artifacts stay attributable without a manual suffix. Debian (glibc) is
# deliberate: OpenWrt's host tools build against glibc, while a musl host
# (Alpine) needs argp/fts/obstack/libintl shims and is not a supported
# combination.
build_image_default: "openwrt:buildroot"
build_image_digest: >-
  {{ lookup('file', project_root ~ '/roles/buildroot/files/Dockerfile')
     | hash('sha256') }}

build_id: "{{ inventory_hostname }}-{{ (build_variant | default({})).name | default('') }}"
builder_workdir: "{{ build_dir }}/work/{{ build_id }}"

# The source tree is cached by (target, ref, kernel-option set): a different
# kernel configuration forces a full kernel + kmod rebuild, so separate trees
# keep one honest incremental build per configuration.
source_target_slug: "{{ (source.target | default('')) | replace('/', '-') }}"
source_ref_slug: "{{ (source.ref | default('')) | replace('/', '-') }}"
source_kernel_digest: >-
  {{ (source.kernel | default([]) | sort | join('\n') | hash('sha1'))[0:8] }}
source_cache_key: >-
  {{ source_target_slug ~ '-' ~ source_ref_slug ~ '-' ~ source_kernel_digest }}

source_dir: "{{ build_dir }}/source/{{ source_cache_key }}"
source_bin_dir: "{{ source_dir }}/bin"
source_dl_dir: "{{ build_dir }}/dl"
source_ccache_dir: "{{ build_dir }}/ccache"
source_image_dir: "{{ build_dir }}/image"
source_container_name: "openwrt-src-{{ build_id }}"

output_dir: "{{ source_bin_dir }}"

module_names:
  - system
  - statistics
  - administration

module_flags:
  - disable-ipv6
