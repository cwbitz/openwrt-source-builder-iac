---
- name: Ensure the shared cache directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ source_dir }}"
    - "{{ source_dl_dir }}"
    - "{{ source_ccache_dir }}"
    - "{{ source_image_dir }}"

- name: Install the pinned build environment definition
  ansible.builtin.copy:
    src: files/Dockerfile
    dest: "{{ source_image_dir }}/Dockerfile"
    mode: "0644"
  register: source_dockerfile

- name: Ensure the project's build environment image is present
  community.docker.docker_image:
    name: "{{ build_image_default.split(':')[0] }}"
    tag: "{{ (build_image_default.split(':') + ['latest'])[1] }}"
    source: build
    build:
      path: "{{ source_image_dir }}"
      pull: false
    force_source: "{{ source_dockerfile is changed }}"
    state: present

- name: Check for a machine-local build environment definition
  ansible.builtin.stat:
    path: "{{ project_root }}/inventory/custom/build-image/Dockerfile"
  delegate_to: localhost
  become: false
  register: build_image_definition

- name: Install the machine-local build environment definition
  ansible.builtin.copy:
    src: "{{ project_root }}/inventory/custom/build-image/Dockerfile"
    dest: "{{ source_image_dir }}/Dockerfile.derived"
    mode: "0644"
  register: source_derived_dockerfile
  when:
    - build_image_override | length > 0
    - build_image_definition.stat.exists

- name: Build the variant's machine-local build environment image
  community.docker.docker_image:
    name: "{{ build_image_name }}"
    tag: "{{ build_image_tag }}"
    source: build
    build:
      path: "{{ source_image_dir }}"
      dockerfile: Dockerfile.derived
      pull: false
    force_source: >-
      {{ (source_derived_dockerfile is changed)
         or (source_dockerfile is changed) }}
    state: present
  when:
    - build_image_override | length > 0
    - build_image_definition.stat.exists

- name: Ensure the variant's external build environment image is present
  community.docker.docker_image:
    name: "{{ build_image_name }}"
    tag: "{{ build_image_tag }}"
    source: local
    state: present
  when:
    - build_image_override | length > 0
    - not build_image_definition.stat.exists

- name: Initialize the source tree repository
  ansible.builtin.command:
    argv: [git, init, "{{ source_dir }}"]
    creates: "{{ source_dir }}/.git/HEAD"

- name: Read the configured origin URL
  ansible.builtin.command:
    argv: [git, -C, "{{ source_dir }}", remote, get-url, origin]
  register: source_origin
  changed_when: false
  failed_when: false

- name: Point origin at the configured repository
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ source_dir }}"
      - remote
      - "{{ 'set-url' if source_origin.rc == 0 else 'add' }}"
      - origin
      - "{{ source_repo_url }}"
  when: source_origin.rc != 0 or (source_origin.stdout | trim) != source_repo_url
  changed_when: true

- name: Read the currently checked-out commit
  ansible.builtin.command:
    argv: [git, -C, "{{ source_dir }}", rev-parse, HEAD]
  register: source_head_before
  changed_when: false
  failed_when: false

- name: Fetch the requested ref (shallow)
  ansible.builtin.command:
    argv: [git, -C, "{{ source_dir }}", fetch, --depth, "1", origin, "{{ source.ref }}"]
  register: source_fetch
  changed_when: false
  failed_when: false

- name: Fetch the requested ref (full, for a commit the server will not serve shallow)
  ansible.builtin.command:
    argv: [git, -C, "{{ source_dir }}", fetch, origin, "{{ source.ref }}"]
  register: source_fetch_full
  changed_when: false
  failed_when: false
  when: source_fetch.rc != 0

- name: Fetch the whole history (last resort)
  ansible.builtin.command:
    argv: [git, -C, "{{ source_dir }}", fetch, --tags, origin]
  register: source_fetch_deep
  changed_when: false
  failed_when: false
  when: source_fetch.rc != 0 and source_fetch_full.rc | default(0) != 0

- name: Assert the requested ref was fetched
  ansible.builtin.assert:
    that:
      - >-
        source_fetch.rc == 0
        or (source_fetch_full.rc | default(1)) == 0
        or (source_fetch_deep.rc | default(1)) == 0
    fail_msg: >-
      Cannot fetch '{{ source.ref }}' from {{ source_repo_url }} into
      {{ source_dir }}. Check the ref (tag/branch/commit) and network access.

- name: Resolve the fetched commit
  ansible.builtin.command:
    argv: [git, -C, "{{ source_dir }}", rev-parse, FETCH_HEAD]
  register: source_fetched_commit
  changed_when: false

- name: Check out the resolved commit
  ansible.builtin.command:
    argv: [git, -C, "{{ source_dir }}", checkout, --force, --detach, "{{ source_fetched_commit.stdout | trim }}"]
  when: >-
    (source_head_before.rc | default(1)) != 0
    or (source_head_before.stdout | trim) != (source_fetched_commit.stdout | trim)
  changed_when: true

- name: Read the resolved commit, tag and date
  ansible.builtin.command:
    argv: [git, -C, "{{ source_dir }}", show, -s, --format=%H %d %cI, "HEAD"]
  register: source_commit_info
  changed_when: false

- name: Update the feeds (cloned tree or an explicit refresh)
  ansible.builtin.command:
    argv: [./scripts/feeds, update, -a]
    chdir: "{{ source_dir }}"
  when: >-
    (source_head_before.rc | default(1)) != 0
    or source_update
    or (source_head_before.stdout | trim) != (source_fetched_commit.stdout | trim)
  changed_when: false

- name: Install the feeds into the package tree
  ansible.builtin.command:
    argv: [./scripts/feeds, install, -a]
    chdir: "{{ source_dir }}"
  register: source_feeds_install
  changed_when: >-
    'installing' in (source_feeds_install.stdout | default(''))

- name: Record the resolved feeds commits
  ansible.builtin.shell:
    cmd: |
      set -eu
      for dir in feeds/*/; do
          [ -d "${dir}.git" ] || continue
          printf '%s %s\n' "$(basename "$dir")" "$(git -C "$dir" rev-parse HEAD)"
      done
    chdir: "{{ source_dir }}"
    executable: /bin/bash
  register: source_feeds
  changed_when: false

- name: Collect the feeds installed into the package tree
  ansible.builtin.find:
    paths: "{{ source_dir }}/package/feeds"
    file_type: directory
    recurse: false
  register: source_feeds_installed
  failed_when: false

- name: Assert every configured feed is installed into the package tree
  ansible.builtin.assert:
    that:
      - source_feeds_missing | length == 0
    fail_msg: >-
      `scripts/feeds install -a` linked no packages for:
      {{ source_feeds_missing | join(', ') }}. An empty feed index makes the
      install a silent no-op, which drops every package from those feeds in
      `make defconfig`. Check that the build host's awk is gawk (mawk lacks
      asort), then rerun.
  vars:
    source_feed_names: >-
      {{ source_feeds.stdout_lines | default([])
         | map('regex_replace', ' .*$', '') | list }}
    source_feeds_missing: >-
      {{ source_feed_names
         | difference(source_feeds_installed.files | default([])
                      | map(attribute='path') | map('basename') | list) }}

- name: Show the resolved source state
  ansible.builtin.debug:
    msg:
      - "HEAD {{ source_commit_info.stdout | trim }}"
      - "Feeds {{ source_feeds.stdout | default('') | split('\n') }}"
