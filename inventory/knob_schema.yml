---
operator_knob_schema:
  mirrors: >-
    mirrors is not defined
    or ((mirrors is mapping)
        and ((mirrors.keys() | difference(['apt', 'docker_registry']) | length) == 0)
        and ((((mirrors | default({}, true)).apt | default('', true)) | string | trim) == ''
             or (((mirrors | default({}, true)).apt | string) is match('^https?://[^\s]+/debian/?$')))
        and (((mirrors | default({}, true)).docker_registry | default([])) is sequence)
        and (((mirrors | default({}, true)).docker_registry | default([])) is not string)
        and (((mirrors | default({}, true)).docker_registry | default([])) is not mapping)
        and (((mirrors | default({}, true)).docker_registry | default([]) | reject('match', '^https?://[^/]+') | list | length) == 0))
  build_variants: >-
    (build_variants is defined)
    and ((build_variants is sequence) and not (build_variants is string)
    and not (build_variants is mapping))
    and ((build_variants | default('', true) | string | trim | length) > 0)
  source_min_free_gb: >-
    (source_min_free_gb is not defined)
    or ((source_min_free_gb | string is match('^[0-9]+$'))
        and (source_min_free_gb | int >= 10)
        and (source_min_free_gb | int <= 500))
